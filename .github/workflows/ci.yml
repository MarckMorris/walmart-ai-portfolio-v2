name: CI

# Runs the test suite of every service. Services are independent FastAPI apps
# with their own requirements.txt, so each is installed and tested in its own
# working directory.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - retail-catalog-normalizer
          - retail-assortment-agent
          - retail-pricing-simulator
          - retail-replenishment-planner
          - retail-product-matching
          - retail-customer-inquiry
          - retail-a11y-review
          - merch-vendor-scorecard
          - merch-planogram-helper
          - merch-promo-optimizer
          - merch-returns-analyzer
          - merch-forecast-comparator
          - merch-content-enrichment
          - merch-shelf-gap-detector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Install
        working-directory: ./${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ./${{ matrix.service }}
        run: python -m pytest -v

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build
        working-directory: ./frontend
        run: |
          npm install
          npm run build

  compose:
    name: docker compose config is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Building 14 images on every push costs more than it catches. Validating
      # the compose file catches the failure that actually happens: a service
      # renamed in one place and not the other.
      - name: Validate compose file
        run: docker compose config --quiet
